<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,post-viewport-fit=cover,initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      body {
        background-color: #000000;
        color: #24A6C7;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section id="main_content">
            <h1>Press any key on your keyboard!</h1>
            <p>Key pressed: <strong id="output">None</strong></p>

            <script>
                // Listen for the 'keydown' event globally
                document.addEventListener('keydown', function(event) {
                    // event.key gives you the actual character or action (e.g., 'Enter', 'a', 'ArrowUp')
                    document.getElementById('output').textContent = event.key;
        
                    // Example: Check for specific keys
                    if (event.key === 'ArrowUp') {
                        console.log('Moving player up!');
                    }
                });
            </script>
      </section>
    </div>
  </body>
</html>
