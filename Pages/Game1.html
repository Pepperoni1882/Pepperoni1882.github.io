<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,post-viewport-fit=cover,initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      body {
        background-color: #000000;
        color: #24A6C7;
        margin: 0;
      }
      .paddle {
        background-color: #ffffff;
        width:5px;
        height:25px;
      }
      .ball {
        background-color: #ffffff;
        width:7px;
        height:7px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section id="main_content">
            <script>
                // Listen for the 'keydown' event globally
                document.addEventListener('keydown', function(event) {
                    // event.key gives you the actual character or action (e.g., 'Enter', 'a', 'ArrowUp')
                    document.getElementById('output').textContent = event.key;
        
                    // Example: Check for specific keys
                    if (event.key === 'ArrowUp') {
                        console.log('Moving player2 Up!');
                    if (event.key === 'ArrowDown') {
                        console.log('Moving player2 Down!');
                    if (event.key === 'w') {
                        console.log('Moving player1 Up!');
                    if (event.key === 's') {
                        console.log('Moving player1 Down!');
                    }
                });
            </script>
            <div class="paddle">
              <div style="margin-left: 30px">
              </div>
              <div style="margin-right: 30px">
              </div>
            </div>
      </section>
    </div>
  </body>
</html>
