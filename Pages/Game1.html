<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,post-viewport-fit=cover,initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      body {
        background-color: #000000;
        color: #24A6C7;
        margin: 0;
      }
      .top_half {
        background-color: #87CEEB;
        width: 100%;
        height: 50%;
        position: absolute;
        top: 0;
        left: 0;
      }
      .bottom_half {
        background-color: #268b07;
        width: 100%;
        height: 50%;
        position: absolute;
        bottom: 0;
        left: 0;
      }
      .layer_1 {
        z-index: 1;
      }
      .layer_2 {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section id="main_content">
        <div class="top_half layer_1">
        </div>
        <div class="bottom_half layer_2">
        </div>
      </section>
    </div>
  </body>
</html>
