<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,post-viewport-fit=cover,initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="container">
      <section id="main_content">
        <dialog id="Insulter">
          <h3>Insult Generator</h3>
          <p id="Insult_msg"></p>
          <button onclick="document.getElementById('Insulter').close()">OK</button>
        </dialog>
        <script>
          let insults = [];
          var title = document.getElementById('Insulter');
          var msg = document.getElementById('Insult_msg');
          fetch('../insults.json')
            .then(response => response.json())
            .then(data => {
              insults = data;
            })
          .catch(error => console.error('Error loading list:', error));
          
          function show_list_iten() {
            if (insults.length === 0) {
              alert('List is still loading or empty!');
              return;
           }
            var max = insults.length;
            var index = Math.floor(Math.random() * max);
            if (insults[index]) {
              msg.textContent = insults[index].trim();
              title.showModal();
            } else {
              alert('Index out of bounds!');
              }
            }
        </script>
        <button onclick="show_list_iten()">For Insult</button>
      </section>
    </div>
  </body>
</html>
