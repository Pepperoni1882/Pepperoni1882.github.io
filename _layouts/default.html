<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,post-viewport-fit=cover,initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="container">
      <section id="main_content">
        <ol type="1" id="insults" style="display: none;">
          <li>Fuck you </li>
          <li>Shittings</li>
          <li>Milk</li>
        </ol>
        <dialog id="Insulter">
          <h3>Insult Generator</h3>
          <p id="Insult_msg"></p>
          <button onclick="document.getElementById('Insulter').close()">OK</button>
        </dialog>
        <script>
          const list = document.getElementById('insults');
          const insults = list.children;
          const min = 0;
          const max = insults.length;
          var title = document.getElementById('Insulter');
          var msg = document.getElementById('Insult_msg');
          
          function show_list_iten() {
            var index = Math.floor(Math.random() * max);
            if (insults[index]) {
              msg.textContent = insults[index].textContent.trim();
              title.showModal();
            } else {
              alert('Index out of bounds!');
              }
            }
        </script>
        <button onclick="show_list_iten()">For Insult</button>
      </section>
    </div>
  </body>
</html>
